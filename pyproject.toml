[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "faangm-research"
version = "0.1.0"
description = "Auditable multi-agent financial research for FAANG plus Microsoft"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "beautifulsoup4>=4.12,<5",
    "faiss-cpu>=1.9,<2",
    "ipykernel>=6.29,<7",
    "jupyter>=1.1,<2",
    "langgraph>=1.0,<2",
    "matplotlib>=3.9,<4",
    "nbconvert>=7.16,<8",
    "numpy>=2.1,<3",
    "pandas>=2.2,<3",
    "psutil>=6,<8",
    "pydantic>=2.10,<3",
    "requests>=2.32,<3",
    "scikit-learn>=1.6,<2",
    "seaborn>=0.13,<1",
    "sentence-transformers>=3.3,<6",
    "torch>=2.6,<3",
    "transformers>=4.48,<5",
    "yfinance>=0.2.54,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "ruff>=0.9,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
